  - from: FHAPGrantee
    to: RECAPTract
    cardinality: has_one
    via: TRACT_LEVE -> GEOID
    join: client-side
    verified: true
    evidence: >-
      FHAP_Grantees.TRACT_LEVE is an 11-digit state+county+tract GEOID (observed
      value 12031017200), and querying RECAP with GEOID='12031017200' returned
      count 1 on 2026-09-07. NOT TRACT: RECAP.TRACT holds only the 6-digit tract
      component (e.g. 003603), so a join on TRACT alone collides across counties.
