      enforces federal laws that prohibit discrimination in housing based on
      race, color, national origin, religion, sex, familial status, and
      disability. This entry tracks FHEO as a federal program area within HUD.
      It is a documentation entry, not a callable surface: FHEO publishes no
      developer portal and no OpenAPI, and its machine-readable surfaces are
      the ArcGIS REST feature services listed as separate entries below plus
      the case-filing spreadsheets cross-listed on data.hud.gov.
