aid: fair-housing-and-equal-opportunity
name: Fair Housing and Equal Opportunity
description: >-
  The mission of the Office of Fair Housing and Equal Opportunity (FHEO) is to
  eliminate housing discrimination, promote economic opportunity, and achieve
  diverse, inclusive communities by leading the nation in the enforcement,
  administration, development, and public understanding of federal fair housing
  policies and laws. FHEO administers the Fair Housing Assistance Program
  (FHAP) and the Fair Housing Initiatives Program (FHIP), enforces Title VIII of
  the Civil Rights Act, and owns the Affirmatively Furthering Fair Housing
  (AFFH) rule and its Data and Mapping Tool. FHEO does not run a developer
  portal of its own; its program data is published as anonymously callable
  ArcGIS REST feature services inside HUD's ArcGIS Online organization and
  through the HUD Open Data site, and its AFFH-T map and report services run on
  HUD's eGIS ArcGIS Server.
