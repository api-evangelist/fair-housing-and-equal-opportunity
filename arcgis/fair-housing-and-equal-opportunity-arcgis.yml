note: >-
  These are the closest thing FHEO has to a machine-readable contract. ArcGIS
  REST service metadata is self-describing the way an OGC GetCapabilities
  document is: it carries the layer's field schema, geometry type, record cap,
  query capabilities and copyright. It is NOT OpenAPI, AsyncAPI, GraphQL SDL,
  WSDL or Protobuf, so it does not satisfy contract_present, and this record
  should not be read as claiming FHEO publishes an API contract. It is saved
  because it is real, it was fetched, and every derivation in this repo
  (data-model, conventions, mcp candidate tools) is grounded in it.
ownership: >-
  services.arcgis.com/VTyQ9soqVukalItT is HUD's own ArcGIS Online organisation
  (items are namespaced HUD:: on hudgis-hud.opendata.arcgis.com) and
  egis.hud.gov is HUD's ArcGIS Server. These specific services are attributed to
  FHEO rather than to the parent HUD record because they publish FHEO's own
  program data and say so: the FHAP service description reads "If such agencies
  are determined by FHEO to enforce state or local fair housing laws...", FHIP
  is the FHEO grant program under 42 U.S.C. 3616, and the affht folder is the
  AFFH Data and Mapping Tool built for FHEO's AFFH rule. The parent HUD record
  covers the eGIS storefront generally and does not list any of these.
